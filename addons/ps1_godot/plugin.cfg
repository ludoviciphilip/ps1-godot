[plugin]

name="PS1 Maker"
description="PS1-style toolkit for Godot 4: vertex jitter, affine textures, 15-bit dithered color, baked vertex lighting, palettes, LOD/draw distance, sprites, sky/water, composite video + CRT, PS1 particles and audio, vertex paint, a grid level painter with procedural dungeons/caves/mazes and RPG Maker-style events, ready-made settings/pause menus and CSV translations."
author="Luis Felipe (ludoviciphilip)"
version="1.0.1"
script="plugin.gd"
