[plugin]

name="PS1 Godot"
description="PS1-style toolkit for Godot 4: vertex jitter, affine textures, 15-bit dithered color, baked vertex lighting, palettes, LOD/draw distance, sprites, sky/water, composite video + CRT, PS1 particles and audio, vertex paint, a grid level painter with procedural dungeons/caves/mazes and RPG Maker-style events."
author="Luis Felipe (ludoviciphilip)"
version="0.11.0"
script="plugin.gd"
